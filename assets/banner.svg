<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatMedium{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(-1deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes dashFlow{0%{stroke-dashoffset:60}}.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-size:40px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-size:17px;font-weight:400;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}.badge-text,.metric-label,.metric-val{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.metric-label{font-size:11px;font-weight:500;fill:#64748b;text-transform:uppercase;letter-spacing:.5px}.metric-val{font-size:15px;font-weight:700;fill:#38bdf8}.animated-card-1{animation:floatSlow 6s ease-in-out infinite}.animated-card-2{animation:floatMedium 5s ease-in-out infinite 1s}.pulsing-orb{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:900px 180px}.pulse-line{stroke-dasharray:6 6;animation:dashFlow 20s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><g class="pulsing-orb"><circle cx="950" cy="160" r="140" fill="#6366f1" filter="url(#glow)" opacity=".25"/><circle cx="1080" cy="220" r="100" fill="#ec4899" filter="url(#glow)" opacity=".2"/></g><circle cx="100" cy="60" r="90" fill="#38bdf8" filter="url(#glow)" opacity=".12"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="90" y2="90"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="270" y2="270"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/></g><path fill="none" stroke="url(#primaryGrad)" stroke-width="2" d="M 700 240 Q 820 120 940 210 T 1180 150" class="pulse-line" opacity=".35"/><g class="animated-card-1"><rect width="230" height="135" x="740" y="55" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity=".4" stroke-width="1.2" backdrop-filter="blur(10px)" rx="14"/><circle cx="765" cy="80" r="10" fill="#10b981" opacity=".85"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" d="M 762 80 L 764.5 82.5 L 769 77"/><text x="785" y="84" fill="#f8fafc" class="badge-text">Enterprise Deal Room</text><rect width="180" height="6" x="765" y="103" fill="#fff" opacity=".1" rx="3"/><rect width="130" height="6" x="765" y="117" fill="#fff" opacity=".1" rx="3"/><rect width="80" height="26" x="765" y="142" fill="#6366f1" stroke="#6366f1" stroke-width="1" opacity=".3" rx="6"/><text x="778" y="159" fill="#c7d2fe" font-family="system-ui" font-size="11" font-weight="700">ACCEPTED</text><text x="860" y="159" fill="#34d399" font-family="system-ui" font-size="14" font-weight="800">$120,000</text></g><g class="animated-card-2"><rect width="240" height="130" x="880" y="175" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stro