<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .metric-label {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .metric-val {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #38bdf8;
      }

      /* Dynamic Floating Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      .animated-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .animated-card-2 {
        animation: floatMedium 5s ease-in-out infinite 1s;
      }
      .pulsing-orb {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 900px 180px;
      }
      .pulse-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="pulsing-orb">
    <circle cx="950" cy="160" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
    <circle cx="1080" cy="220" r="100" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  </g>
  <circle cx="100" cy="60" r="90" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Dynamic Curved Connection Wave Behind Cards -->
  <path d="M 700 240 Q 820 120 940 210 T 1180 150" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.35" class="pulse-line" />

  <!-- Dynamic Floating Decorative Mockup Card 1 (Proposal Ready) -->
  <g class="animated-card-1">
    <rect x="740" y="55" width="230" height="135" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" backdrop-filter="blur(10px)" />
    <circle cx="765" cy="80" r="10" fill="#10b981" opacity="0.85" />
    <path d="M 762 80 L 764.5 82.5 L 769 77" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="785" y="84" class="badge-text" fill="#f8fafc">Enterprise Deal Room</text>
    <rect x="765" y="103" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1" />
    <rect x="765" y="117" width="130" height="6" rx="3" fill="#ffffff" opacity="0.1" />
    <rect x="765" y="142" width="80" height="26" rx="6" fill="#6366f1" opacity="0.3" stroke="#6366f1" stroke-width="1" />
    <text x="778" y="159" font-family="system-ui" font-size="11" font-weight="700" fill="#c7d2fe">ACCEPTED</text>
    <text x="860" y="159" font-family="system-ui" font-size="14" font-weight="800" fill="#34d399">$120,000</text>
  </g>

  <!-- Dynamic Floating Decorative Mockup Card 2 (CPQ Engine) -->
  <g class="animated-card-2">
    <rect x="880" y="175" width="240" height="130" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4" backdrop-filter="blur(10px)" />
    <circle cx="905" cy="202" r="10" fill="#ec4899" opacity="0.8" />
    <text x="901" y="206" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff">⚡</text>
    <text x="925" y="206" class="badge-text" fill="#f8fafc">Smart CPQ &amp; Quote</text>
    <text x="905" y="235" class="metric-label">Close Velocity</text>
    <text x="905" y="255" class="metric-val">+340% Faster</text>
    <text x="1015" y="235" class="metric-label">E-Signature</text>
    <text x="1015" y="255" font-family="system-ui" font-size="14" font-weight="700" fill="#a78bfa">Verified ✓</text>
    <rect x="905" y="275" width="190" height="6" rx="3" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Clear & Prominent) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 60)">
      <rect width="270" height="30" rx="15" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="badge-text" fill="#c7d2fe">ENTERPRISE SALES &amp; REVENUE TECH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Sales Quotation &amp; Proposal
    </text>
    <text x="0" y="195" class="title-text" fill="url(#primaryGrad)">
      Management Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="238" class="subtitle-text">
      A curated guide to CPQ engines, quote builders &amp; interactive proposal suites
    </text>
    <text x="0" y="262" class="subtitle-text" fill="#64748b">
      Compare SaaS market leaders, modern pricing, valuations, and self-hosted open-source alternatives.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="14" y="18" class="badge-text">⚡ CPQ Engines</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="135" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="149" y="18" class="badge-text">✍️ E-Signatures</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="294" y="18" class="badge-text">📊 Revenue Analytics</text>

      <!-- Pill 4 -->
      <rect x="450" y="0" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="464" y="18" class="badge-text">🌐 Open Source</text>
    </g>
  </g>
</svg>
